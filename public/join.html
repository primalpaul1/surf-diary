<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You're invited &middot; Swellnotes</title>
<link rel="icon" href="/sn-logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ocean-deep:#041428;--ocean-dark:#0a2240;--teal:#1a73e8;--foam:#e8f4f8;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui,sans-serif}
body{min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(120% 80% at 50% 0%,#123a63 0%,#0a2240 42%,#041428 100%);padding:0 1.5rem}
.logo{width:44px;height:44px;border-radius:11px;margin:calc(env(safe-area-inset-top) + 2.4rem) 0 2rem}
.wrap{width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.loading{color:rgba(255,255,255,.6);margin-top:3rem}
.inviter{display:flex;align-items:center;gap:.55rem;color:rgba(255,255,255,.8);font-size:.98rem;margin-bottom:1rem}
.inviter img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.35)}
.inviter span{font-weight:600}
h1{font-family:'DM Serif Display',serif;font-size:2.4rem;line-height:1.12;margin-bottom:.7rem}
.sub{color:rgba(255,255,255,.62);font-size:1rem;line-height:1.5;margin-bottom:1.8rem;max-width:340px}
.crew-card{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;
  overflow:hidden;margin-bottom:1.4rem;backdrop-filter:blur(8px)}
.crew-card .cover{width:100%;height:150px;object-fit:cover;display:block}
.crew-card .cover.ph{background:linear-gradient(135deg,#1a4a7a,#0a2240)}
.crew-info{padding:1rem 1.1rem;text-align:left}
.crew-info h2{font-family:'DM Serif Display',serif;font-size:1.5rem;line-height:1.1}
.crew-info p{color:rgba(255,255,255,.6);font-size:.9rem;margin:.15rem 0 .5rem}
.crew-info .mc{display:inline-block;background:rgba(26,115,232,.25);border:1px solid rgba(74,154,245,.5);
  color:#cfe0ff;font-size:.78rem;font-weight:700;padding:.22rem .6rem;border-radius:99px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:16px;
  font-weight:700;font-size:1.05rem;text-decoration:none;gap:.5rem}
.btn.primary{background:#fff;color:#0a2240;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.btn.primary:active{transform:scale(.99)}
.apple{width:18px;height:22px;fill:#0a2240}
.cont{display:inline-block;margin-top:1.1rem;color:rgba(255,255,255,.6);font-size:.95rem;text-decoration:none;font-weight:600}
.cont:hover{color:#fff}
.foot{color:rgba(255,255,255,.4);font-size:.82rem;margin:2.4rem 0 calc(env(safe-area-inset-bottom) + 1.6rem)}
.foot b{font-family:'DM Serif Display',serif;font-weight:400;color:rgba(255,255,255,.65)}
</style></head>
<body>
  <img class="logo" src="/sn-logo.png" alt="Swellnotes">
  <div class="wrap"><div id="content" class="loading">Loading your invite…</div></div>
  <div class="foot"><b>Swellnotes</b> &middot; Know your spot.</div>
<script>
// TODO: set to the App Store URL once the app is approved. Empty = "Open Swellnotes" (web).
const APP_STORE_URL='';
const APPLE_SVG='<svg class="apple" viewBox="0 0 24 24"><path d="M17.05 12.04c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.1-2.01-3.77-2.04-1.6-.16-3.13.94-3.94.94-.81 0-2.07-.92-3.4-.9-1.75.03-3.36 1.02-4.26 2.58-1.82 3.16-.47 7.83 1.3 10.4.86 1.26 1.89 2.67 3.24 2.62 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.39.81 1.4-.02 2.29-1.28 3.15-2.55.99-1.46 1.4-2.87 1.42-2.94-.03-.01-2.73-1.05-2.76-4.17zM14.6 4.6c.72-.87 1.2-2.08 1.07-3.29-1.03.04-2.28.69-3.02 1.56-.66.77-1.24 2-1.09 3.18 1.15.09 2.32-.58 3.04-1.45z"/></svg>';
const params=new URLSearchParams(location.search);
const codeMatch=location.pathname.match(/^\/join\/([\w-]+)$/);
const ref=params.get('ref');
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function url(u){if(u==null)return'';const s=String(u);if(/^\s*(javascript|vbscript|data:text)/i.test(s))return'';return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(html){const c=document.getElementById('content');c.className='';c.innerHTML=html;}
function cta(webHref){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const primary=(APP_STORE_URL&&isIOS)
    ? `<a class="btn primary" href="${url(APP_STORE_URL)}">${APPLE_SVG}Get Swellnotes</a>`
    : `<a class="btn primary" href="${url(webHref)}">Open Swellnotes</a>`;
  return `${primary}<a class="cont" href="${url(webHref)}">Continue in your browser &rarr;</a>`;
}
function generic(){render(`<h1>Swellnotes</h1><p class="sub">Know your spot. Log every session and track the swell with your crew.</p>${cta('/')}`);}
function renderPersonal(name,avatar){
  render(`
    <div class="inviter">${avatar?`<img src="${url(avatar)}" alt="">`:''}<span>${esc(name)} invited you</span></div>
    <h1>Log surf together<br>on Swellnotes</h1>
    <p class="sub">Track every session, know your spots, and see how your crew is scoring the swell.</p>
    ${cta('/')}`);
}
function renderCrew(inv,code){
  const who=inv.inviter_name?`${esc(inv.inviter_name)} invited you to` : `You're invited to`;
  render(`
    <div class="inviter">${inv.inviter_avatar?`<img src="${url(inv.inviter_avatar)}" alt="">`:''}<span>${who}</span></div>
    <div class="crew-card">
      ${inv.cover_image_url?`<img class="cover" src="${url(inv.cover_image_url)}" alt="">`:'<div class="cover ph"></div>'}
      <div class="crew-info"><h2>${esc(inv.spot_name||'a crew')}</h2><p>${esc(inv.location_text||'')}</p><span class="mc">${inv.member_count||1} surfer${inv.member_count===1?'':'s'}</span></div>
    </div>
    <p class="sub">Join the crew on Swellnotes to log sessions and track this spot together.</p>
    ${cta('/join/'+encodeURIComponent(code)+'?app=web')}`);
}
if(location.pathname==='/join'&&ref){fetch('/api/users/'+encodeURIComponent(ref)).then(r=>r.json()).then(u=>{renderPersonal((u&&!u.error&&u.display_name)?u.display_name:'A friend',u&&u.avatar_path);}).catch(generic);}
else if(codeMatch){fetch('/api/invite/'+codeMatch[1]).then(r=>r.ok?r.json():Promise.reject()).then(inv=>renderCrew(inv,codeMatch[1])).catch(()=>render(`<h1>Invite not found</h1><p class="sub">This invite link may have expired or been used up.</p>${cta('/')}`));}
else{generic();}
</script>
</body></html>
